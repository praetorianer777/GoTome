# GOtome is two containers: the app and its database. A third, init, runs
# once before them and exits: it gives a new installation its own random
# database password, which both of them read from the secrets volume.
#
# For development and the test gate, run it through make (mk/stack.mk), which
# names the project and picks the host port from the checkout's path so that
# parallel worktrees never share a database or collide on a port. The defaults
# below are what a bare `docker compose -f deploy/docker-compose.yml up` gets.
name: gotome

services:
  init:
    image: ${GOTOME_IMAGE:-ghcr.io/praetorianer777/gotome:latest}
    command: ["init"]
    # Root, to write into the volume docker creates owned by root.
    user: "0"
    environment:
      # Only for an installation that set its own password before: init then
      # writes that one instead of a random one. Leave it unset otherwise.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/secrets
    restart: "no"

  app:
    image: ${GOTOME_IMAGE:-ghcr.io/praetorianer777/gotome:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GOTOME_ENV: ${GOTOME_ENV:-production}
      GOTOME_HTTP_ADDR: ":8080"
      GOTOME_LOG_LEVEL: ${GOTOME_LOG_LEVEL:-info}
      # How often every library's folder is looked through for changes; 0
      # leaves scanning to the "Scan now" button.
      GOTOME_SCAN_INTERVAL: ${GOTOME_SCAN_INTERVAL:-6h}
      # The largest file one upload may carry, in MiB.
      GOTOME_UPLOAD_LIMIT_MB: ${GOTOME_UPLOAD_LIMIT_MB:-4096}
      GOTOME_DATABASE_URL: postgres://gotome@db:5432/gotome?sslmode=disable
      GOTOME_DATABASE_PASSWORD_FILE: /secrets/db-password
      # Encrypts the secrets kept in the database, such as provider keys.
      # gotome init writes it; back it up with the database, or they are lost.
      GOTOME_SECRET_KEY_FILE: /secrets/secret-key
    volumes:
      - app-data:/data
      - secrets:/secrets:ro
      # A folder of books you already have becomes an "external" library.
      # Mount it here, read-only unless GOtome should write metadata back:
      # - /path/to/your/books:/books:ro
    ports:
      - "${GOTOME_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "gotome", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    # Longer than the time the app gives requests and background jobs to
    # finish, so that a stop lets a running scan put down what it holds.
    stop_grace_period: 75s
    restart: unless-stopped

  db:
    # ParadeDB is Postgres 18 with pg_search and pgvector. Pinned by digest: the
    # extensions are pre-1.0 and an index may need rebuilding across versions,
    # so the image only changes in a commit that says so.
    image: paradedb/paradedb:0.25.11-pg18@sha256:a9cbdcfd8a1c349ab21590fd6d6dcbe7da489878df6502922d032dd64c1a7ae7
    environment:
      POSTGRES_USER: gotome
      POSTGRES_DB: gotome
      POSTGRES_PASSWORD_FILE: /secrets/db-password
    volumes:
      - db-data:/var/lib/postgresql
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # Over TCP on purpose: the image's first-boot server listens on the
      # socket only, so this passes once the init scripts have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gotome -d gotome"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

volumes:
  app-data:
  db-data:
  # The database password, written once by init.
  secrets:
