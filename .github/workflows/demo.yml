name: Demo

# The clickable demo (#396): the web app against a fake API in the browser,
# with public-domain sample books, on GitHub Pages. Built on every release tag
# and by hand. The owner enables Pages once: Settings, Pages, Source: GitHub
# Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The books are not kept in the repository; the lock file holds their
      # hashes and every source is checked against it. In order: the cache of
      # an earlier run, the sites (which refuse GitHub's runners at times),
      # and the copy in the release demo-books (docs/demo.md). The cache is
      # saved by demo-books.yml on main, the only ref a tag can read (#493).
      - name: Restore the sample books
        uses: actions/cache/restore@v4
        with:
          path: web/demo/files
          key: demo-books-${{ hashFiles('web/demo/sample-books.lock.json') }}

      - name: Fetch the sample books
        id: sites
        continue-on-error: true
        run: make sample-books

      - name: Fetch the missing books from the release demo-books
        if: steps.sites.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/demo-books-release
          gh release download demo-books --repo "$GITHUB_REPOSITORY" \
            --pattern sample-books.tar --dir .cache/demo-books-release --clobber
          tar -xf .cache/demo-books-release/sample-books.tar -C .cache/demo-books-release
          make sample-books SAMPLE_BOOKS_FROM=.cache/demo-books-release

      - name: Build the demo
        run: make web-demo

      - name: Test the demo build
        run: make test-demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
