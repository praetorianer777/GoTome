name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Go module and build caches
        uses: actions/cache@v4
        with:
          path: .cache/go
          key: go-${{ runner.os }}-${{ hashFiles('mk/go.mk', 'backend/go.mod', 'backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # A push runs the gate with the browser smoke tests; here every browser
      # test runs in every browser.
      - name: Run the test suite
        run: ./run-tests.sh --full

      - name: Upload the browser suite's report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Home servers are often arm64. Building the image and starting the stack on
  # an arm64 runner finds what only breaks there before a release does.
  arm64:
    name: image builds and boots on arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start the stack
        run: make stack-up

      - name: Check the running stack
        run: make stack-check

      - name: Show the logs
        if: failure()
        run: make stack-logs || true

      - name: Tear down
        if: always()
        run: make stack-down || true
