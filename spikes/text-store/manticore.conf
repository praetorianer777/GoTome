# Manticore for the spike of #268: real-time mode (data_dir), the HTTP API
# on the spike's own network only, and no Buddy, the PHP helper the image
# starts beside searchd for features GOtome would not use.
searchd {
	listen = 9308:http
	listen = 127.0.0.1:9306:mysql
	data_dir = /var/lib/manticore
	log = /var/log/manticore/searchd.log
	query_log = /var/log/manticore/query.log
	pid_file = /var/run/manticore/searchd.pid
	buddy_path =
}
